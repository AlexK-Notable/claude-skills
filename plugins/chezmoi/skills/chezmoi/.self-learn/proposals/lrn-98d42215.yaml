card:
  headline: >-
    chezmoi cd hangs any non-interactive shell until the timeout kills
    it — it spawns an interactive subshell that never returns (cost a
    2-minute Bash-tool hang yesterday).
  provenance: >-
    July 13th teach capture, evidence quote: 'Command timed out after 2m
    0s'.
  impact: >-
    Kept (skill-md): chezmoi sessions use git -C "$(chezmoi source-
    path)" or cd "$(chezmoi source-path)" in a compound command — no
    more dead 2-minute waits. Declined: the anti-pattern recurs every
    time an agent reaches for the intuitive-looking command.
  discuss: >-
    Two-step decision: route to skill-md NOW for advisory coverage, and
    let M3's hook compiler later supersede it with a deterministic guard
    (the doctrine-clean path) — or defer entirely until M3. Skill-md-now
    is recommended; the trigger/instruction text is already well-formed.
