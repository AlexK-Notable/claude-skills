card:
  headline: >-
    A stray `sudo npm install -g` self-updated npm to 11.17.0 while pacman
    still thought it owned 11.16.0-1 — the resulting file-ownership
    split-brain silently failed three straight `pacman -Syu` runs over three
    weeks (~180 MiB of updates never applied) before anyone noticed.
  provenance: "2026-07-15, post-update triage session (npm/pacman conflict)"
  impact: >-
    Keep: next time a `pacman -Syu`/paru run aborts citing conflicting files
    under `/usr/lib/node_modules/`, hypr-doctor's triage will check `pacman
    -Q npm` against the version in `/usr/lib/node_modules/npm/package.json`
    first, recognize the split-brain instead of guessing at a generic
    conflict, and point to the `rm -rf /usr/lib/node_modules/npm && pacman
    -Syu` fix instead of a partial-file overwrite that leaves stray unowned
    files (283 of them, in the incident that surfaced this). Decline: the
    signature is rediscoverable by reading the pacman error closely, but it
    cost three weeks of a silently unpatched system last time — nothing
    currently in the skill's failure table would have caught it faster.
  discuss: >-
    The record bundles two lessons — a diagnostic signature (route to
    skill-md/reference, works today) and a preventive command-block (best
    as a hook, but M3 isn't built). Worth deciding whether to route the
    diagnostic half now via skill-md and park the prevention half, or hold
    the whole record until hooks compile. Also worth confirming scope: this
    is really "don't sudo-install npm packages globally on an Arch box",
    which arguably belongs in `~/.claude/CLAUDE.md`'s sudo/system-package
    guidance rather than hypr-doctor specifically — hypr-doctor owns the
    *diagnosis*, not npm hygiene in general.
