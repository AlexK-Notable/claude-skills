alternates: [claude-md]
rationale: >
  Anti-pattern with a mechanical detector — a Bash command shaped like `cp -r`/`rsync`
  copying a directory that contains a uv project (pyproject.toml + .venv) — and the
  failure is silent (tests report false passes), which is exactly where a deterministic
  guard beats advisory prose. The M3 hook compiler doesn't exist yet, so claude-md is the
  routable alternate today. Record scope is `project`, but generality is `general-practice`
  and the lesson has no tie to claude-skills' own architecture (it would recur in any uv
  project, e.g. cron-claude's), so if routed as claude-md now, ~/.claude/CLAUDE.md (user
  scope) is arguably the more honest fire-surface than the repo CLAUDE.md — flagged for the
  human in discuss rather than decided here.
