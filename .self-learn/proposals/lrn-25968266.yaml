card:
  headline: >
    A sandboxed copy of a uv project (made with cp -r or rsync) silently ran the ORIGINAL
    source's code twice in one session — once during a mutation-test kill-check, once
    during a prober baseline — because the copied .venv's editable install still pointed
    back at the original tree, so every mutation looked like it changed nothing.
  provenance: >
    July 15th, self-learn CLI mutation-test audit — two invalidated test runs before the
    cause was found.
  impact: >
    Keep: next time Claude cp -r's or rsync's a uv project into a sandbox to run mutation
    tests or any isolated experiment, it will delete the copied .venv (`rm -rf
    <copy>/.venv`) and re-sync before running anything, instead of trusting the copy's
    already-populated environment. Decline: the mistake is rediscoverable but expensive to
    rediscover — it fails silently (results look normal, just wrong), and it already cost
    two full mutation-test runs before the false-pass pattern was diagnosed; without the
    rule it will likely recur in the next sandboxed uv experiment, in this repo or another.
  discuss: >
    Two live calls for the reviewer: (1) mechanism — the ideal fix is a deterministic hook
    that catches cp -r/rsync of a uv project and flags the stale .venv before anything
    runs, but the hook compiler (M3) doesn't exist yet, so today's routable choice is
    advisory prose in a CLAUDE.md. (2) scope — the record was captured as project-scoped,
    but the lesson has nothing to do with claude-skills' own architecture (it would just as
    easily bite in cron-claude's uv env or any future uv project), so ~/.claude/CLAUDE.md
    (user scope) may be the more honest fire-surface than this repo's CLAUDE.md, despite
    the narrowest-surface bias favoring project scope when both would fire equally. Nothing
    else is contentious — the underlying claim is verified firsthand (two invalidated runs,
    not a guess).
